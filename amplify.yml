version: 1
frontend:
  phases:
    preBuild:
      commands:
        # react-router requires node >=22.22; the default Amplify image ships an older 22.x
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build -w @maysi/web
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
